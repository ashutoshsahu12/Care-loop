name = "careloop-backend"
main = "src/worker.ts"
compatibility_date = "2024-05-12"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
APP_NAME = "CARELOOP"

[[d1_databases]]
binding = "DB"
database_name = "careloop"
database_id = "careloop-d1-production"
migrations_dir = "src/db"
